name: Load environment variables
description: Load public configuration from the pinned Threshold action revision
inputs:
  environment:
    description: Configuration name in config/env
    required: true
  ref:
    description: Optional explicit Threshold CI configuration ref; omitted uses this action revision
    required: false
runs:
  using: composite
  steps:
    - name: Import environment configuration
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_ENVIRONMENT: ${{ inputs.environment }}
        CONFIG_REF: ${{ inputs.ref }}
      run: bash "$ACTION_PATH/load.sh"
